apiVersion: apps/v1
kind: Deployment
metadata:
  name: cli
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cli
  template:
    metadata:
      labels:
        app: cli
        workspace-role: provider
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: workspace
      - name: codex-state
        persistentVolumeClaim:
          claimName: codex-state
      - name: chat-policy
        emptyDir: {}
      - name: cli-socket
        persistentVolumeClaim:
          claimName: cli-socket
      - name: browser-output
        persistentVolumeClaim:
          claimName: browser-output
      initContainers:
      - name: socket-directory
        image: localhost/kolmogor-agent:workspace-v2
        imagePullPolicy: Never
        command: ["/bin/sh", "-ec"]
        args:
        - |
          install -d -m 0700 /ipc/private /policy/rules /policy/workspace
          touch /policy/config.toml
        securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
        volumeMounts:
        - {name: cli-socket, mountPath: /ipc}
        - {name: chat-policy, mountPath: /policy}
      containers:
      - name: cli
        command: ["/bin/sh", "-ec"]
        args:
        - |
          install -d -m 0700 /home/node/run/private
          exec codex -c 'mcp_servers.browser.url="http://browser:8931/mcp"' app-server --listen unix:///home/node/run/private/codex.sock
        image: localhost/kolmogor-agent:workspace-v2
        imagePullPolicy: Never
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: codex-state
          mountPath: /home/node/.codex
        # Same account and resumable sessions. The chat view masks user configuration
        # and rules and uses an empty project, without changing the interactive CLI.
        - {name: codex-state, mountPath: /opt/kolmogor-chat/home}
        - {name: chat-policy, subPath: config.toml, mountPath: /opt/kolmogor-chat/home/config.toml, readOnly: true}
        - {name: chat-policy, subPath: rules, mountPath: /opt/kolmogor-chat/home/rules, readOnly: true}
        - {name: chat-policy, subPath: workspace, mountPath: /opt/kolmogor-chat/workspace, readOnly: true}
        - name: cli-socket
          mountPath: /tmp/codex-daemon-1000
          subPath: private
        - name: cli-socket
          mountPath: /home/node/run
        - name: browser-output
          mountPath: /workspace/browser-output
          readOnly: true
        readinessProbe:
          exec:
            command:
            - test
            - -S
            - /home/node/run/private/codex.sock
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
