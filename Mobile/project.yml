name: KolmogorMobile
options:
  deploymentTarget:
    iOS: "17.4"
settings:
  base:
    DEVELOPMENT_TEAM: MSMG8CJLB3
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Kolmogor:
    type: application
    platform: iOS
    sources: [Kolmogor]
    info:
      path: Kolmogor/Info.plist
      properties:
        CFBundleDisplayName: Kolmogor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.ahmedelamin.Kolmogor.workspace
            CFBundleURLSchemes: [kolmogor-account]
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmedelamin.Kolmogor
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  KolmogorTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies: [{target: Kolmogor}]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmedelamin.KolmogorTests
        GENERATE_INFOPLIST_FILE: YES
  KolmogorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies: [{target: Kolmogor}]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmedelamin.KolmogorUITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Kolmogor:
    build:
      targets:
        Kolmogor: all
    test:
      targets: [KolmogorTests, KolmogorUITests]
